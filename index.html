<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><meta name="description" content="Play a live cricket player auction with friends."><link rel="manifest" href="./manifest.json"><link rel="icon" href="./icon-192.png"><title>Cricket Auction · Live Rooms</title>
<style>.player-photo{position:absolute;right:24px;top:18px;width:130px;height:130px;object-fit:cover;object-position:top;border-radius:50%;border:3px solid #ffffffbb;box-shadow:0 8px 24px #0008;z-index:1}.profile:after{pointer-events:none}.profile>div:not(.flag):not(.stats){position:relative;z-index:1}.stat{background:#111111;border-color:var(--line)}.role-tag{display:inline-flex;align-items:center;width:max-content;background:var(--lime);color:#000000;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:850;margin-top:5px;position:relative;z-index:1}.entry .role-tag{margin:0 4px 0 0;flex:none}.source-link{position:relative;z-index:1;margin-top:8px;color:#ff8585;font-size:11px;width:max-content}.avatar{position:relative;flex:none;overflow:hidden}.avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
:root {
  --bg: #000000;            /* Pure, deep absolute black background */
  --panel: #111111;          /* Dark grey for cards and containers */
  --line: #333333;           /* Darker border lines */
  --card-bg: linear-gradient(145deg, #111111, #0a0a0a);
  --ink: #FFFFFF;            /* Pure white text */
  --muted: #AAAAAA;          /* Muted grey text */
  --lime: #FF3131;           /* Neon Red accent color */
  --red: #FF4444;            /* Warning red */
  --amber: #FFC46A;          /* Alert amber */
}

/* Fix Secondary Buttons (Players & teams, Leave room, Play music) */
button.secondary {
  background: var(--panel) !important;
  color: var(--ink) !important;
  border: 1px solid var(--line) !important;
}

button.secondary:hover {
  background: #222222 !important;
  border-color: var(--lime) !important;
}

/* Fix Music Controls Box */
.music-controls {
  background: var(--panel) !important;
  border-color: var(--line) !important;
}

/* Fix Player Profile Card Background (Absolute Black & Dark Red Tint) */
.profile {
  background: linear-gradient(130deg, #1f0505, #111111 75%) !important;
  border: 1px solid var(--line);
}

*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#190a0a,var(--bg) 56%);color:var(--ink);font:15px/1.45 system-ui,Segoe UI,sans-serif}.wrap{max-width:1160px;margin:auto;padding:22px}header,.between,.row,.team,.entry{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.brand{font-weight:900;font-size:19px}.mark{background:var(--lime);color:#000000;border-radius:12px;padding:9px 12px}.sub,.help,small{color:var(--muted)}.card{background:linear-gradient(145deg,#111111,#0a0a0a);border:1px solid var(--line);border-radius:18px;padding:20px;margin:12px 0}.screen{display:none}.screen.on{display:block}.hero{max-width:800px;margin:4vh auto}.hero h1{font-size:clamp(38px,7vw,56px);line-height:1.02;margin:8px 0;letter-spacing:-2px}.lime{color:var(--lime)}.eyebrow{color:var(--lime);font-weight:850;letter-spacing:1.5px;font-size:12px}button{border:0;border-radius:11px;padding:12px 16px;font-weight:800;cursor:pointer;background:var(--lime);color:#000000}button.secondary{background:#111111;color:var(--ink);border:1px solid var(--line)}button.danger{background:#49262d;color:#ffd0d0;border:1px solid #74424a}button:disabled{opacity:.4;cursor:not-allowed}input,select{background:#0a0a0a;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:11px;width:100%;font:inherit}.field{display:block;margin:10px 0;color:#c7d0d6;font-size:13px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:24px}.pill{border:1px solid var(--line);padding:7px 10px;border-radius:20px;color:var(--muted);font-size:12px;white-space:nowrap}.team{justify-content:space-between;background:#111111;border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0}.team input{width:min(32%,220px)}.auction{display:grid;grid-template-columns:1.4fr .9fr;gap:12px}.flag{font-size:36px;position:relative;z-index:1}.profile h2{font-size:clamp(32px,5vw,42px);margin:6px 0;position:relative;z-index:1}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:14px;position:relative;z-index:1}.stat{background:#0a0a0aaa;border:1px solid var(--line);border-radius:9px;padding:9px}.stat b{display:block}.price{text-align:center;font-size:36px;font-weight:900;color:var(--lime);margin:12px}.controls{text-align:center}.controls button{margin:4px}.list{max-height:440px;overflow:auto}.entry{background:#111111;border:1px solid var(--line);border-radius:10px;padding:9px;margin:7px 0}.grow{flex:1}.avatar{width:38px;height:38px;border-radius:10px;background:#222222;display:grid;place-items:center;font-size:20px}.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;padding:18px;z-index:9}.modal.open{display:grid}.modalbox{background:#111111;border:1px solid var(--line);border-radius:18px;padding:20px;width:min(720px,100%);max-height:88vh;overflow:auto}.tabs{display:flex;gap:8px;margin-bottom:12px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--lime);color:#000000;padding:11px 17px;border-radius:10px;display:none;font-weight:800;z-index:12;max-width:90vw}.toast.show{display:block}.error{color:var(--red)}.statusline{min-height:22px;color:var(--muted);font-size:13px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar>*{flex:1;min-width:160px}.count{color:var(--amber)}.music-controls{margin:12px 0;padding:12px 16px}.music-controls .row{align-items:center;flex-wrap:wrap;justify-content:flex-end}.music-controls select{width:min(280px,100%);flex:1 1 180px}.music-controls button{flex:none}.music-controls .field{flex:none}.music-controls input[type=range]{width:120px;padding:0;accent-color:var(--lime)}@media(max-width:760px){.auction,.cols{grid-template-columns:1fr}.hero{margin-top:2vh}.team{flex-wrap:wrap}.team input{width:calc(50% - 8px);flex:1}.stats{grid-template-columns:1fr 1fr}.topactions{display:flex;flex-wrap:wrap}}
